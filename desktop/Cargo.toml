[package]
name = "finanzillo"
version = "2.0.0"
edition = "2024"
description = "FinanZillo — gastos, ingresos y patrimonio personal (escritorio)"
license = "MIT"
repository = "https://github.com/adrmoralf/FinanZillo"
publish = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
egui-phosphor = { version = "0.14", default-features = false, features = ["light"] }
rusqlite = { version = "0.37", features = ["bundled", "serialize", "backup"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
